name: Android Debug Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Verify LSPosed module metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$apk" | grep -F "META-INF/xposed/module.prop"
          unzip -l "$apk" | grep -F "META-INF/xposed/java_init.list"
          unzip -l "$apk" | grep -F "META-INF/xposed/scope.list"
          unzip -p "$apk" META-INF/xposed/scope.list | grep -Fx "com.android.systemui"
          mkdir -p dist
          cp "$apk" "dist/DualSignal-v1.8.3-safe-debug.apk"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DualSignal-v1.8.3-safe-debug
          path: dist/DualSignal-v1.8.3-safe-debug.apk
          if-no-files-found: warn
          retention-days: 14
